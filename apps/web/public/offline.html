<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Offline</title>
<style>
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
         background: #0e0f13; color: #eef0f4; font-family: system-ui, sans-serif; }
  .box { text-align: center; padding: 24px; }
  img { width: 72px; height: 72px; margin-bottom: 16px; }
  p { color: #8b90a0; font-size: 14px; }
  button { margin-top: 16px; padding: 10px 22px; border: 0; border-radius: 10px;
           background: #4d7aff; color: #fff; font-size: 14px; font-weight: 600; }
</style>
</head>
<body>
  <div class="box">
    <img src="/icon-192.png" alt="" />
    <h1 style="font-size:18px;margin:0 0 6px">You're offline</h1>
    <p>Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
